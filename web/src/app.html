<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#2f2f31" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/anki.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/anki-192.png" />
		<title>Anki</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- shown until the app's code has loaded (routes/(app)/+page.svelte removes it) -->
		<p
			id="ankiweb-loading"
			style="position: fixed; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #888"
		>
			Loading Anki…
		</p>
		<script>
			if (location.pathname !== "/") document.getElementById("ankiweb-loading").remove();
			setTimeout(function () {
				var placeholder = document.getElementById("ankiweb-loading");
				if (placeholder) placeholder.textContent = "Anki didn't load. Check your connection, then reload.";
			}, 60000);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
